<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebCS</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #view { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #e8dcb0; font: 600 20px/1.4 Verdana, Tahoma, sans-serif; text-shadow: 1px 1px 0 #000;
    pointer-events: none;
  }
  #debug {
    position: fixed; left: 8px; top: 6px; margin: 0; color: #c8ffc8;
    font: 12px/1.3 Consolas, monospace; text-shadow: 1px 1px 0 #000; pointer-events: none;
  }
  .hud {
    position: fixed; bottom: 14px; display: flex; align-items: baseline; gap: 18px;
    color: #f2ecd8; font: 700 28px/1 Verdana, Tahoma, sans-serif; text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.7);
    pointer-events: none; font-variant-numeric: tabular-nums;
  }
  .hud small { font-size: 13px; font-weight: 600; opacity: 0.75; margin-right: 4px; }
  #hud-left { left: 20px; }
  #hud-right { right: 20px; flex-direction: column; align-items: flex-end; gap: 4px; }
  #hud-weapon { font-size: 14px; font-weight: 600; opacity: 0.8; }
  /* Scopes: black around a circle, sniper cross lines or the AUG / SG 553 red dot. */
  #scope { position: fixed; inset: 0; display: none; pointer-events: none;
    background: radial-gradient(circle at 50% 50%, transparent calc(47vh - 1px), #000 47vh); }
  #scope.cross, #scope.dot { display: block; }
  /* Flashbangs: white over the frozen frame of the moment. */
  #afterimage, #flash { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }
  #flash { background: #fff; }
  #scope::before, #scope::after { content: ''; position: absolute; background: #000; }
  #scope.cross::before { left: 0; right: 0; top: 50%; height: 1px; }
  #scope.cross::after { top: 0; bottom: 0; left: 50%; width: 1px; }
  #scope.dot::after { left: 50%; top: 50%; width: 5px; height: 5px; margin: -2px 0 0 -2px; border-radius: 50%;
    background: #e8221a; }
  #killfeed {
    position: fixed; right: 12px; top: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
    font: 600 13px/1.2 Verdana, Tahoma, sans-serif; pointer-events: none;
  }
  #killfeed div { background: rgba(0, 0, 0, 0.45); padding: 4px 8px; border-radius: 3px; color: #eee; }
  #killfeed div.mine { outline: 1px solid #c33; }
  #killfeed .t { color: #e8c46a; }
  #killfeed .ct { color: #8cb4f0; }
  #killfeed .hs { color: #f66; }
  #hud-money { position: fixed; left: 20px; bottom: 56px; color: #9fd67a; font: 700 22px/1 Verdana, Tahoma, sans-serif;
    text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.7); pointer-events: none; }
  #roundbar { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); padding: 4px 14px; border-radius: 3px;
    background: rgba(0, 0, 0, 0.45); color: #f2ecd8; font: 700 16px/1.3 Verdana, Tahoma, sans-serif; white-space: pre;
    pointer-events: none; }
  #banner { position: fixed; left: 0; right: 0; top: 20%; text-align: center; color: #f2ecd8;
    font: 700 30px/1.4 Verdana, Tahoma, sans-serif; text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.8); pointer-events: none; }
  #scoreboard { position: fixed; left: 50%; top: 14%; transform: translateX(-50%); display: none; min-width: 420px;
    background: rgba(10, 12, 16, 0.82); padding: 10px 14px; border-radius: 4px; color: #ddd;
    font: 13px/1.6 Verdana, Tahoma, sans-serif; pointer-events: none; }
  #scoreboard table { width: 100%; border-collapse: collapse; }
  #scoreboard td:not(:first-child) { text-align: right; width: 40px; }
  #scoreboard tr.ct td { color: #8cb4f0; font-weight: 700; padding-top: 8px; }
  #scoreboard tr.t td { color: #e8c46a; font-weight: 700; padding-top: 8px; }
  #scoreboard tr.me td { color: #fff; font-weight: 700; }
  #scoreboard tr.dead td { opacity: 0.45; }
  #buymenu { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none;
    width: min(560px, calc(100vw - 32px)); box-sizing: border-box; max-height: calc(100vh - 32px); overflow-y: auto;
    background: rgba(12, 14, 18, 0.92); border: 1px solid #444; border-radius: 4px; padding: 12px;
    color: #eee; font: 14px/1.4 Verdana, Tahoma, sans-serif; }
  #buymenu.closed .items::before { content: 'Buying is not possible here or now'; display: block; color: #e88; margin-bottom: 6px; }
  #buymenu .cats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  #buymenu button { font: inherit; color: inherit; background: #262a31; border: 1px solid #3a3f48; border-radius: 3px;
    padding: 6px 10px; cursor: pointer; }
  #buymenu button:hover:not(:disabled) { background: #354050; }
  #buymenu button:disabled { opacity: 0.4; cursor: default; }
  #buymenu .items { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #buymenu .items button { display: flex; justify-content: space-between; }
  #buymenu .price { color: #9fd67a; }
  #buymenu .hint { margin-top: 10px; font-size: 11px; opacity: 0.6; }
  @media (max-width: 520px) { #buymenu .items { grid-template-columns: 1fr; } }
  #roundbar.planted { color: #ff5a4a; }
  #hud-bomb { position: fixed; left: 20px; bottom: 86px; color: #d8a24a; font: 700 18px/1 Verdana, Tahoma, sans-serif;
    text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.7); pointer-events: none; }
  #hud-bomb.site { color: #7cf27c; animation: blink 0.8s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  #progress { position: fixed; left: 50%; top: 62%; transform: translateX(-50%); width: min(320px, calc(100vw - 32px));
    display: none; pointer-events: none; color: #f2ecd8; font: 600 13px/1.4 Verdana, Tahoma, sans-serif;
    text-align: center; text-shadow: 1px 1px 0 #000; }
  #progress > div:first-child { height: 8px; width: 0; background: #e8c46a; border-radius: 2px;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6); }
  #console { position: fixed; left: 0; top: 0; width: min(960px, 100vw); height: 48vh; display: none;
    flex-direction: column; box-sizing: border-box; padding: 8px; background: rgba(14, 16, 20, 0.92);
    border: 1px solid #3a3f48; border-top: 0; border-left: 0; z-index: 10; font: 13px/1.35 Consolas, monospace; }
  #console .out { flex: 1; overflow-y: auto; white-space: pre-wrap; word-break: break-word; color: #d8d8d0; }
  #console .out .echo { color: #9ab; }
  #console input { margin-top: 6px; background: #1d2027; color: #eee; border: 1px solid #3a3f48; padding: 4px 6px;
    font: inherit; outline: none; }
  #netgraph { position: fixed; right: 12px; bottom: 96px; display: none; pointer-events: none; text-align: right; }
  #netgraph canvas { display: block; margin-left: auto; }
  #netgraph pre { margin: 2px 0 0; color: #e8e8e0; font: 12px/1.3 Consolas, monospace; text-shadow: 1px 1px 0 #000; }
  body.spectator #hud-money, body.spectator #hud-bomb, body.nostats .hud, body.dm #hud-money { display: none; }
  #scoreboard tr.ffa td { color: #e8dcb0; font-weight: 700; padding-top: 8px; }
  #scoreboard tr.spec td { color: #9aa0a8; padding-top: 8px; }
  #menu .menu-teams button.spec { color: #c8c2b0; }
  body.nohud .hud, body.nohud #hud-money, body.nohud #hud-bomb, body.nohud #roundbar, body.nohud #killfeed { display: none; }
  #death {
    position: fixed; left: 0; right: 0; top: 32%; text-align: center; display: none;
    color: #f2ecd8; font: 700 22px/1.4 Verdana, Tahoma, sans-serif; text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.7);
    pointer-events: none;
  }
  /* Start / pause menu (client/menu.js): actions on the left, the open panel beside them. */
  #menu { position: fixed; inset: 0; z-index: 5; display: none; gap: 28px; padding: 6vh 6vw; box-sizing: border-box;
    background: linear-gradient(160deg, #1b1e23 0%, #101215 60%, #0b0c0e 100%); color: #e6e1d2;
    font: 14px/1.45 Verdana, Tahoma, sans-serif; overflow-y: auto; }
  #menu.open { display: flex; }
  #menu.pause { background: rgba(8, 10, 12, 0.72); }
  #menu h1 { margin: 0 0 28px; font: 700 44px/1 Verdana, Tahoma, sans-serif; letter-spacing: 2px; color: #e8c46a;
    text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.6); }
  #menu h2 { margin: 0 0 14px; font-size: 20px; }
  #menu h3 { margin: 14px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #9aa0a8; }
  #menu button { font: inherit; color: inherit; background: #262a31; border: 1px solid #3a3f48; border-radius: 3px;
    padding: 7px 12px; cursor: pointer; }
  #menu button:hover { background: #354050; }
  #menu button.active { border-color: #e8c46a; background: #3a3627; }
  .menu-side { flex: 0 0 220px; display: flex; flex-direction: column; }
  .menu-nav { display: flex; flex-direction: column; gap: 4px; }
  #menu .menu-nav button { background: none; border: 0; border-left: 3px solid transparent; text-align: left;
    padding: 8px 12px; font-size: 20px; font-weight: 700; }
  #menu .menu-nav button:hover { background: rgba(255, 255, 255, 0.06); }
  #menu .menu-nav button.active { border-left-color: #e8c46a; background: rgba(232, 196, 106, 0.1); }
  .menu-note { margin-top: 18px; color: #9fd67a; min-height: 1.4em; }
  .menu-note.error { color: #f08a7a; }
  .menu-panel { flex: 0 1 640px; min-width: 0; align-self: flex-start; background: rgba(14, 16, 20, 0.86);
    border: 1px solid #333840; border-radius: 4px; padding: 18px 20px; }
  .menu-panel.empty { display: none; }
  .menu-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
  .menu-row > span:first-child { flex: 0 0 190px; }
  .menu-row input[type=range] { flex: 1; min-width: 80px; accent-color: #e8c46a; }
  .menu-row input.num { width: 70px; }
  .menu-row input, .menu-row select { font: inherit; color: #eee; background: #1d2027; border: 1px solid #3a3f48;
    border-radius: 3px; padding: 4px 6px; }
  .menu-row input[type=checkbox] { width: 18px; height: 18px; accent-color: #e8c46a; }
  .menu-bind button.key { flex: 0 0 120px; padding: 4px 8px; font-size: 12px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .menu-settings, .menu-maps { scrollbar-color: #3a3f48 transparent; }
  .menu-bind button.key.waiting { border-color: #e8c46a; color: #e8c46a; }
  .menu-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .menu-settings { max-height: calc(100vh - 12vh - 170px); overflow-y: auto; padding-right: 6px; }
  .menu-preview canvas { display: block; width: 100%; height: 120px; border-radius: 3px; margin-bottom: 8px; }
  .menu-teams { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  #menu .menu-teams button { flex: 1 1 160px; padding: 14px; font-size: 16px; font-weight: 700; }
  #menu .menu-teams button.t { color: #e8c46a; }
  #menu .menu-teams button.ct { color: #8cb4f0; }
  .menu-maps button { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-maps { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px;
    max-height: 40vh; overflow-y: auto; }
  #menu button.menu-go { margin-top: 8px; padding: 10px 28px; font-size: 16px; font-weight: 700; background: #3a3627;
    border-color: #e8c46a; }
  #menu button.menu-reset { margin-top: 12px; font-size: 12px; }
  .menu-server { color: #c8c2b0; }
  .menu-hint { color: #9aa0a8; font-size: 12px; }
  @media (max-width: 720px) {
    #menu { flex-direction: column; padding: 16px; gap: 12px; }
    .menu-side { flex: none; }
    #menu h1 { font-size: 32px; margin-bottom: 12px; }
    .menu-nav { flex-direction: row; flex-wrap: wrap; }
    #menu .menu-nav button { font-size: 16px; border-left: 0; border-bottom: 3px solid transparent; }
    #menu .menu-nav button.active { border-bottom-color: #e8c46a; }
    .menu-row { flex-wrap: wrap; }
    .menu-row > span:first-child { flex-basis: 100%; }
    .menu-row.check > span:first-child { flex: 1; }
    .menu-settings { max-height: none; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="status">loading...</div>
<div id="scope"></div>
<canvas id="afterimage"></canvas>
<div id="flash"></div>
<pre id="debug"></pre>
<div id="killfeed"></div>
<div id="roundbar"></div>
<div id="banner"></div>
<div id="hud-money"></div>
<div id="hud-bomb"></div>
<div id="progress"><div></div><div></div></div>
<div id="scoreboard"></div>
<div id="buymenu"></div>
<div id="death"></div>
<div id="menu"></div>
<div id="hud-left" class="hud">
  <span><small>HP</small><span id="hud-health"></span></span>
  <span><small>ARMOR</small><span id="hud-armor"></span></span>
</div>
<div id="hud-right" class="hud">
  <span id="hud-weapon"></span>
  <span id="hud-ammo"></span>
</div>
<!-- If any module fails to load (often an ad blocker), say so instead of hanging on "loading...". -->
<script type="module" src="/client/main.js"
  onerror="document.getElementById('status').textContent = 'Failed to load the game scripts. If an ad blocker is on, allow this site; then check the console.'"></script>
</body>
</html>
