<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComicStrike</title>
<link rel="icon" type="image/svg+xml" href="/client/favicon.svg">
<style>
  /* Comic print: paper, ink and a few flat inks (the look of client/gl's composite). System
     fonts only, no font files: Impact-like display lettering, a comic hand for text. */
  :root {
    --paper: #f6eedb; --paper-hi: #fffaf0; --ink: #17130f; --yellow: #ffd23a; --red: #e2402a; --blue: #2f6fc4;
    --sky: #8cc9e4; --sky-dot: #4a97cc; --money: #9be15d; --t: #ffb84a; --ct: #7db8ff;
    --display: Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Black", sans-serif;
    --body: "Comic Sans MS", "Comic Neue", "Chalkboard SE", "Trebuchet MS", sans-serif;
    color-scheme: light;
  }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
  #view { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--yellow); font: 32px/1.4 var(--display); letter-spacing: 0.04em;
    -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink);
    pointer-events: none;
  }
  #radar { position: fixed; left: 10px; top: 10px; display: none; pointer-events: none; }
  body.nohud #radar { display: none !important; }
  #debug {
    position: fixed; left: 8px; top: calc(var(--radar, 0px) + 6px); margin: 0; color: var(--paper);
    font: 12px/1.3 Consolas, monospace; text-shadow: 1px 1px 0 var(--ink); pointer-events: none;
  }
  /* Big HUD numbers: yellow, an inked outline, a hard drop shadow. */
  .hud, #hud-money, #hud-bomb {
    -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink);
  }
  .hud {
    position: fixed; bottom: 14px; display: flex; align-items: baseline; gap: 18px;
    color: var(--yellow); font: 38px/1 var(--display); letter-spacing: 0.03em;
    pointer-events: none; font-variant-numeric: tabular-nums;
  }
  .hud small { display: inline-block; margin-right: 6px; padding: 3px 7px 1px; transform: translateY(-4px) rotate(-2deg);
    background: var(--ink); color: var(--paper); font: 15px/1 var(--display); letter-spacing: 0.08em;
    -webkit-text-stroke: 0; text-shadow: none; }
  #hud-left { left: 20px; }
  #hud-right { right: 20px; flex-direction: column; align-items: flex-end; gap: 6px; }
  #hud-weapon { padding: 4px 9px 2px; background: var(--yellow); color: var(--ink); font-size: 17px;
    border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); -webkit-text-stroke: 0; text-shadow: none; }
  #hud-weapon:empty { display: none; }
  /* Scopes: ink around a circle, sniper cross lines or the AUG / SG 553 red dot. */
  #scope { position: fixed; inset: 0; display: none; pointer-events: none;
    background: radial-gradient(circle at 50% 50%, transparent calc(47vh - 14px), rgba(23, 19, 15, 0.55) calc(47vh - 4px),
      var(--ink) 47vh); }
  #scope.cross, #scope.dot { display: block; }
  /* Flashbangs: white over the frozen frame of the moment. */
  #flash { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }
  /* Flashbang white-out: paper over the print, a starburst where it went off, FLASH! */
  #flash { background: var(--paper-hi); overflow: hidden; }
  #flash .burst { position: absolute; left: var(--x, 50%); top: var(--y, 50%); width: 72vmin; height: 72vmin;
    transform: translate(-50%, -50%) scale(var(--k, 1)); }
  #flash .burst i { position: absolute; inset: 0; }
  #flash .star { background: var(--yellow); }
  #flash .core { inset: 24% !important; background: #fffdf4; }
  #flash .ring { inset: -10% !important; border-radius: 50%; border: 0.7vmin solid rgba(255, 200, 70, 0.55); }
  #flash .ring.r2 { inset: -26% !important; border-color: rgba(255, 200, 70, 0.3); }
  #flash b { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%) rotate(var(--r, -6deg));
    font: 16vmin/1 var(--display); color: var(--red); -webkit-text-stroke: 0.45vmin var(--ink);
    text-shadow: 0.9vmin 0.9vmin 0 var(--ink); white-space: nowrap; }
  #scope::before, #scope::after { content: ''; position: absolute; background: var(--ink); }
  #scope.cross::before { left: 0; right: 0; top: 50%; height: 2px; box-shadow: 0 0 0 1px rgba(246, 238, 219, 0.45); }
  #scope.cross::after { top: 0; bottom: 0; left: 50%; width: 2px; box-shadow: 0 0 0 1px rgba(246, 238, 219, 0.45); }
  #scope.dot::after { left: 50%; top: 50%; width: 7px; height: 7px; margin: -3px 0 0 -3px; border-radius: 50%;
    background: var(--red); box-shadow: 0 0 0 2px var(--ink); }
  #killfeed {
    position: fixed; right: 12px; top: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    font: 18px/1.15 var(--display); letter-spacing: 0.03em; pointer-events: none;
  }
  #killfeed div { background: var(--ink); padding: 5px 10px 3px; color: var(--paper);
    box-shadow: 3px 3px 0 rgba(23, 19, 15, 0.35); }
  #killfeed div.mine { outline: 2px solid var(--yellow); }
  #killfeed .t { color: var(--t); }
  #killfeed .ct { color: var(--ct); }
  #killfeed .hs { background: var(--yellow); color: var(--ink); padding: 1px 5px 0; font-weight: 400; }
  #hud-money { position: fixed; left: 20px; bottom: 64px; color: var(--money); font: 28px/1 var(--display);
    letter-spacing: 0.03em; pointer-events: none; }
  #roundbar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); padding: 5px 16px 3px;
    background: var(--paper); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); color: var(--ink);
    font: 20px/1.25 var(--display); letter-spacing: 0.04em; white-space: pre; text-align: center; pointer-events: none; }
  #roundbar:empty { display: none; }
  #banner { position: fixed; left: 0; right: 0; top: 20%; text-align: center; color: var(--yellow);
    font: 46px/1.2 var(--display); letter-spacing: 0.03em; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
    text-shadow: 1px 1px 0 var(--ink), 2px 2px 0 var(--ink), 3px 3px 0 var(--ink), 4px 4px 0 var(--ink),
      5px 5px 0 var(--ink); pointer-events: none; }
  /* Panels: paper, a heavy ink border, a hard shadow. */
  #scoreboard { background: var(--paper); border: 4px solid var(--ink); box-shadow: 8px 8px 0 var(--ink);
    color: var(--ink); }
  #scoreboard { position: fixed; left: 50%; top: 14%; transform: translateX(-50%); display: none; min-width: 440px;
    padding: 10px 16px 12px; font: 15px/1.6 var(--body); pointer-events: none; }
  #scoreboard table { width: 100%; border-collapse: collapse; }
  #scoreboard td:not(:first-child) { text-align: right; width: 44px; font-variant-numeric: tabular-nums; }
  #scoreboard tr.ct td, #scoreboard tr.t td, #scoreboard tr.ffa td, #scoreboard tr.spec td {
    padding-top: 10px; font: 20px/1.4 var(--display); letter-spacing: 0.05em; border-bottom: 3px solid var(--ink); }
  #scoreboard tr.ct td { color: var(--blue); }
  #scoreboard tr.t td { color: var(--red); }
  #scoreboard tr.ffa td { color: var(--ink); }
  #scoreboard tr.spec td { color: #6d665c; }
  #scoreboard tr.me td { background: var(--yellow); font-weight: 700; }
  #scoreboard tr.dead td { opacity: 0.45; text-decoration: line-through; }
  /* Buy menu: CS:GO's radial wheel in print. A full-screen layer (the mouse's direction picks a sector);
     paper sectors with heavy ink edges and a hard shadow, the hovered one yellow and pushed out. */
  #buymenu { position: fixed; inset: 0; display: none; cursor: default; user-select: none;
    background: radial-gradient(circle, rgba(31, 26, 23, 0.28) 0 34%, rgba(31, 26, 23, 0) 70%); }
  #buymenu .wheel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(600px, calc(100vw - 32px), calc(100vh - 80px)); height: auto; overflow: visible;
    filter: drop-shadow(6px 6px 0 var(--ink)); }
  #buymenu .ring { transform-box: view-box; transform-origin: 50% 50%; }
  #buymenu .ring.pop { animation: wheel-pop 160ms cubic-bezier(0.2, 1.4, 0.4, 1); }
  @keyframes wheel-pop { from { transform: scale(0.82) rotate(-10deg); opacity: 0; } }
  #buymenu .sector path { fill: var(--paper-hi); stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; }
  #buymenu .sector { transition: transform 70ms ease-out; cursor: pointer; }
  #buymenu .sector.hot path { fill: var(--yellow); }
  #buymenu .sector.off path { fill: url(#buy-hatch); }
  #buymenu .sector.off text { opacity: 0.5; }
  #buymenu .sector.off.hot path { fill: #e9dfb8; }
  #buymenu .hatch-bg { fill: #e4dccb; }
  #buymenu .hatch-line { stroke: #b9ad97; stroke-width: 3; }
  #buymenu text { text-anchor: middle; fill: var(--ink); font-family: var(--display); letter-spacing: 0.04em;
    pointer-events: none; }
  #buymenu text.cat { font-size: 26px; dominant-baseline: middle; }
  #buymenu text.name { font-size: 17px; }
  #buymenu text.price { font-size: 17px; fill: var(--red); }
  #buymenu text.key { font-size: 13px; opacity: 0.55; }
  #buymenu .center circle { fill: var(--paper); stroke: var(--ink); stroke-width: 4; }
  #buymenu .center text.big { font-size: 24px; }
  #buymenu .center text.price { font-size: 22px; }
  #buymenu .center text.small { font: 14px var(--body); letter-spacing: 0; }
  #buymenu .center text.warn { fill: var(--red); font-weight: 700; }
  #buymenu .hint { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; color: var(--paper-hi);
    font: 14px var(--body); text-shadow: 1px 1px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink),
      -1px 1px 0 var(--ink); }
  #roundbar.planted { background: var(--red); color: var(--yellow); }
  #hud-bomb { position: fixed; left: 20px; bottom: 100px; color: var(--t); font: 26px/1 var(--display);
    letter-spacing: 0.04em; pointer-events: none; }
  #hud-bomb.site { color: var(--money); animation: blink 0.8s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  #progress { position: fixed; left: 50%; top: 62%; transform: translateX(-50%); width: min(320px, calc(100vw - 32px));
    display: none; pointer-events: none; color: var(--yellow); font: 18px/1.5 var(--display); letter-spacing: 0.04em;
    text-align: center; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; text-shadow: 2px 2px 0 var(--ink); }
  #progress > div:first-child { height: 12px; width: 0; background: var(--yellow); border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink); }
  #console { position: fixed; left: 0; top: 0; width: min(960px, 100vw); height: 48vh; display: none;
    flex-direction: column; box-sizing: border-box; padding: 0 8px 8px; background: rgba(23, 19, 15, 0.94);
    border-right: 3px solid var(--yellow); border-bottom: 3px solid var(--yellow); z-index: 10;
    font: 13px/1.35 Consolas, monospace; }
  #console.moved { border: 3px solid var(--yellow); box-shadow: 5px 5px 0 rgba(23, 19, 15, 0.5); }
  #console .bar { display: flex; align-items: center; margin: 0 -8px 6px; padding: 2px 4px 2px 10px;
    background: var(--yellow); color: var(--ink); cursor: move; user-select: none; touch-action: none; }
  #console .bar .title { flex: 1; font: 15px/1.2 var(--display); letter-spacing: 1px;
    text-transform: uppercase; }
  #console .bar button { border: 0; background: none; color: var(--ink); font: bold 18px/1 sans-serif;
    padding: 0 6px; cursor: pointer; }
  #console .out { flex: 1; overflow-y: auto; white-space: pre-wrap; word-break: break-word; color: var(--paper); }
  #console .out .echo { color: var(--yellow); }
  #console .line { position: relative; display: flex; margin-top: 6px; }
  #console input { flex: 1; min-width: 0; background: var(--paper-hi); color: var(--ink); border: 2px solid var(--paper);
    padding: 4px 6px; font: inherit; outline: none; }
  #console .suggest { position: absolute; left: 0; right: 0; top: 100%; display: none; max-height: 250px;
    overflow-y: auto; background: var(--paper-hi); color: var(--ink); border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 rgba(23, 19, 15, 0.6); z-index: 1; }
  #console .suggest.up { top: auto; bottom: 100%; }
  #console .suggest .item { display: flex; gap: 10px; padding: 1px 6px; white-space: nowrap; cursor: pointer; }
  #console .suggest .item:hover { background: var(--paper); }
  #console .suggest .item.sel { background: var(--yellow); }
  #console .suggest .name { font-weight: bold; }
  #console .suggest .value { color: var(--red); max-width: 30%; overflow: hidden; text-overflow: ellipsis; }
  #console .suggest .help { flex: 1; overflow: hidden; text-overflow: ellipsis; opacity: 0.7; }
  #console .grip { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize;
    touch-action: none; background: linear-gradient(135deg, transparent 50%, var(--yellow) 50%, var(--yellow) 60%,
    transparent 60%, transparent 70%, var(--yellow) 70%, var(--yellow) 80%, transparent 80%); }
  #netgraph { position: fixed; right: 12px; bottom: 120px; display: none; pointer-events: none; text-align: right; }
  #netgraph canvas { display: block; margin-left: auto; }
  #netgraph pre { margin: 2px 0 0; color: var(--paper); font: 12px/1.3 Consolas, monospace;
    text-shadow: 1px 1px 0 var(--ink); }
  body.spectator #hud-money, body.spectator #hud-bomb, body.nostats .hud, body.dm #hud-money { display: none; }
  #menu .menu-teams button.spec { color: #6d665c; }
  body.nohud .hud, body.nohud #hud-money, body.nohud #hud-bomb, body.nohud #roundbar, body.nohud #killfeed,
  body.nohud #fx { display: none; }
  /* Death and spectator notice: a caption box. */
  #death {
    position: fixed; left: 50%; top: 30%; transform: translateX(-50%) rotate(-1deg); display: none; max-width: 80vw;
    padding: 8px 14px 6px; background: var(--yellow); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
    color: var(--ink); font: 700 18px/1.4 var(--body); text-align: center; pointer-events: none;
  }
  /* Our death: a comic panel (client/deathpanel.js). The view tilts inside a frame of
     paper and ink, focus lines rush in, a big word bursts, a narration box names the killer. */
  #view { transition: transform 0.45s cubic-bezier(0.2, 1.4, 0.4, 1); }
  body.dying #view { transform: rotate(-3deg) scale(1.12); image-rendering: auto; }
  body.dying #death, body.nohud #deathpanel, body.dying .hud, body.dying #hud-money, body.dying #hud-bomb,
  body.dying #radar, body.dying #roundbar, body.dying #killfeed { display: none !important; }
  #deathpanel { position: fixed; inset: 0; pointer-events: none; visibility: hidden; overflow: hidden; }
  #deathpanel.on { visibility: visible; }
  .dp-frame { position: absolute; inset: 0; box-shadow: inset 0 0 0 0 var(--paper), inset 0 0 0 0 var(--ink);
    transition: box-shadow 0.35s cubic-bezier(0.2, 1.3, 0.4, 1); }
  #deathpanel.on .dp-frame { box-shadow: inset 0 0 0 3vh var(--paper), inset 0 0 0 3.8vh var(--ink); }
  .dp-lines { position: absolute; inset: 0; opacity: 0; transform: scale(1.5);
    background: repeating-conic-gradient(from 0deg at 50% 45%, rgba(23, 19, 15, 0.8) 0deg 0.6deg, transparent 0.6deg 4.1deg),
      repeating-conic-gradient(from 1.7deg at 50% 45%, rgba(23, 19, 15, 0.6) 0deg 0.35deg, transparent 0.35deg 6.7deg);
    -webkit-mask: radial-gradient(ellipse at 50% 45%, transparent 30%, #000 75%);
    mask: radial-gradient(ellipse at 50% 45%, transparent 30%, #000 75%);
    transition: opacity 0.2s, transform 0.5s ease-out; }
  #deathpanel.on .dp-lines { opacity: 0.55; transform: scale(1); }
  .dp-word { position: absolute; left: 50%; top: 42%; display: grid; place-items: center;
    transform: translate(-50%, -50%) rotate(-8deg) scale(0); }
  #deathpanel.on .dp-word { animation: dpword 0.5s cubic-bezier(0.2, 1.6, 0.4, 1) 0.08s forwards; }
  @keyframes dpword { to { transform: translate(-50%, -50%) rotate(-8deg) scale(1); } }
  .dp-word .bk, .dp-word .fg { position: absolute; inset: -60% -26%; }
  .dp-word .bk { background: var(--ink); transform: translate(0.8vh, 0.8vh) scale(1.06); }
  .dp-word .fg { background: var(--red); }
  .dp-word b { position: relative; font: 15vh/1 var(--display); color: var(--yellow); letter-spacing: 0.02em;
    -webkit-text-stroke: 0.8vh var(--ink); paint-order: stroke fill; text-shadow: 0.06em 0.06em 0 var(--ink); }
  .dp-word small { position: relative; margin-top: 0.6vh; font: 4.2vh/1 var(--display); color: var(--paper-hi);
    letter-spacing: 0.12em; -webkit-text-stroke: 0.3vh var(--ink); paint-order: stroke fill; }
  .dp-word small:empty { display: none; }
  .dp-caption { position: absolute; left: 7vh; top: 7vh; max-width: 60vw; padding: 1vh 1.6vh;
    background: var(--yellow); border: 0.45vh solid var(--ink); box-shadow: 0.7vh 0.7vh 0 var(--ink);
    transform: translateX(-120%) rotate(-1.5deg); transition: transform 0.35s cubic-bezier(0.2, 1.3, 0.4, 1) 0.15s; }
  #deathpanel.on .dp-caption { transform: translateX(0) rotate(-1.5deg); }
  .dp-caption span { display: block; font: 700 3.2vh/1.15 var(--body); text-transform: uppercase; }
  .dp-caption em { display: block; font: 2.4vh/1.2 var(--body); }
  .dp-caption em:empty { display: none; }
  /* Comic sound words (client/inkwords.js). */
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pop { position: absolute; left: 0; top: 0; will-change: transform; }
  .pop .in { position: absolute; left: 0; top: 0; display: grid; place-items: center;
    transform: translate(-50%, -50%) rotate(var(--r));
    animation: pop var(--life, 700ms) cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards; }
  .pop .bk, .pop .fg { position: absolute; inset: -46% -20%; }
  .pop .bk { background: var(--ink); transform: scale(1.1); }
  .pop .fg { background: var(--yellow); }
  .pop b { position: relative; display: inline-block; font: var(--s)/1 var(--display); white-space: nowrap;
    color: var(--red); -webkit-text-stroke: calc(var(--s) * 0.055) var(--ink); paint-order: stroke fill;
    text-shadow: 0.05em 0.05em 0 var(--ink); letter-spacing: 0.02em; padding: 0 0.1em; }
  .pop.big .fg { background: var(--red); }
  .pop.big b { color: var(--yellow); }
  .pop.wall b { color: var(--paper-hi); text-shadow: 0.06em 0.06em 0 var(--ink); }
  .pop.spark .in { width: var(--s); height: var(--s); }
  .pop.spark .bk, .pop.spark .fg { inset: 0; }
  .pop.spark .bk { transform: scale(1.25); }
  .pop.shot b, .pop.ticker b { color: var(--yellow); text-shadow: 0.05em 0.05em 0 var(--red), 0.1em 0.1em 0 var(--ink); }
  /* A spray's growing line: it grows to the right from where it starts, on a jagged balloon. */
  .pop.ticker { transition: transform 0.12s; }
  .pop.ticker .in { animation: none; transform: translate(0, -50%) rotate(var(--r)); transition: opacity 0.3s, transform 0.3s; }
  .pop.ticker .bk, .pop.ticker .fg { inset: -38% -9%; }
  .pop.ticker .fg { background: var(--red); }
  .pop.ticker b { transform-origin: 0 50%; }
  .pop.ticker.old .in { opacity: 0.45; }
  .pop.ticker.out .in { opacity: 0; transform: translate(0, calc(-50% - 30px)) rotate(var(--r)); }
  @keyframes pop {
    0% { transform: translate(-50%, -50%) rotate(var(--r)) scale(0.2); opacity: 1; }
    14% { transform: translate(-50%, -50%) rotate(var(--r)) scale(1.18); }
    26% { transform: translate(-50%, -50%) rotate(var(--r)) scale(1); }
    72% { opacity: 1; }
    100% { transform: translate(-50%, -78%) rotate(var(--r)) scale(0.92); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .pop .in { animation-timing-function: linear; } }
  /* Start / pause menu (client/menu.js): actions on the left, the open panel beside them, over
     a dot-screened sky (start) or the dotted, dimmed game (pause). */
  #menu { position: fixed; inset: 0; z-index: 5; display: none; gap: 32px; padding: 6vh 6vw; box-sizing: border-box;
    background: radial-gradient(circle, var(--sky-dot) 32%, transparent 34%) 0 0 / 11px 11px, var(--sky);
    color: var(--ink); font: 15px/1.45 var(--body); overflow-y: auto; }
  #menu.open { display: flex; }
  #menu.pause { background: radial-gradient(circle, rgba(23, 19, 15, 0.4) 1.5px, transparent 2.2px) 0 0 / 8px 8px,
    rgba(23, 19, 15, 0.22); }
  .menu-logo { display: flex; align-items: center; gap: 14px; margin: 0 0 26px; }
  .menu-logo img { width: clamp(56px, 7vw, 84px); height: auto; flex: none; transform: rotate(-8deg); }
  #menu h1 { margin: 0; font: clamp(56px, 8vw, 92px)/0.9 var(--display); letter-spacing: 0.02em;
    color: var(--yellow); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; transform: rotate(-3deg);
    transform-origin: left; text-shadow: 1px 1px 0 var(--ink), 2px 2px 0 var(--ink), 3px 3px 0 var(--ink),
      4px 4px 0 var(--ink), 5px 5px 0 var(--ink), 6px 6px 0 var(--ink), 7px 7px 0 var(--ink); }
  #menu h2 { margin: 0 0 14px; font: 30px/1 var(--display); letter-spacing: 0.04em; color: var(--red);
    -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; text-shadow: 2px 2px 0 var(--ink); }
  #menu h3 { margin: 16px 0 6px; font: 17px/1 var(--display); letter-spacing: 0.1em; color: var(--ink); opacity: 0.75; }
  #menu button { font: 17px/1 var(--display); letter-spacing: 0.04em; color: var(--ink); background: var(--paper-hi);
    border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 8px 12px 6px; cursor: pointer; }
  #menu button:hover { background: var(--yellow); }
  #menu button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  #menu button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  #menu button.active { background: var(--yellow); }
  .menu-side { flex: 0 0 240px; display: flex; flex-direction: column; }
  .menu-nav { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  #menu .menu-nav button { font-size: 26px; padding: 8px 18px 5px; background: var(--paper);
    box-shadow: 4px 4px 0 var(--ink); }
  #menu .menu-nav button:nth-child(odd) { transform: rotate(-1deg); }
  #menu .menu-nav button:nth-child(even) { transform: rotate(1deg); }
  #menu .menu-nav button:hover { background: var(--yellow); }
  #menu .menu-nav button.active { background: var(--red); color: var(--yellow); -webkit-text-stroke: 1px var(--ink);
    paint-order: stroke fill; text-shadow: 2px 2px 0 var(--ink); }
  .menu-note { margin-top: 18px; min-height: 1.4em; align-self: flex-start; }
  .menu-note:not(:empty) { padding: 6px 10px; background: var(--yellow); border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink); font-weight: 700; transform: rotate(-1deg); }
  .menu-note.error:not(:empty) { background: var(--red); color: var(--paper-hi); }
  .menu-panel { flex: 0 1 660px; min-width: 0; align-self: flex-start; background: var(--paper);
    border: 4px solid var(--ink); box-shadow: 10px 10px 0 var(--ink); padding: 20px 24px 24px; }
  .menu-panel.empty { display: none; }
  .menu-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .menu-row > span:first-child { flex: 0 0 200px; font-weight: 700; }
  .menu-row input[type=range] { flex: 1; min-width: 80px; accent-color: var(--red); }
  .menu-row input.num { width: 70px; }
  .menu-row input, .menu-row select { font: inherit; color: var(--ink); background: var(--paper-hi);
    border: 2px solid var(--ink); padding: 4px 6px; }
  .menu-row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--red); }
  #menu .menu-bind button.key { flex: 0 0 120px; padding: 5px 8px 3px; font: 700 14px/1.2 var(--body);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; box-shadow: 2px 2px 0 var(--ink); }
  .menu-settings, .menu-maps { scrollbar-color: var(--ink) transparent; }
  #menu .menu-bind button.key.waiting { background: var(--yellow); }
  .menu-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  /* The Video tab's window: the game canvas shows through a hole clipped out of #menu. */
  .menu-window { aspect-ratio: 16 / 9; width: min(100%, 53.3vh); margin: 0 auto 8px; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
    background: var(--paper-hi); position: relative; }
  .menu-window .hole { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .menu-window .hole.ready .note { display: none; }
  .menu-window .note { font: 20px/1 var(--display); letter-spacing: 0.04em; opacity: 0.6; }
  .menu-compare { gap: 14px; margin-bottom: 6px; }
  #menu button.menu-hold { font-size: 14px; padding: 6px 10px 4px; }
  #menu button.menu-hold:active { background: var(--red); color: var(--paper-hi); }
  .menu-settings { max-height: calc(100vh - 12vh - 180px); overflow-y: auto; padding-right: 8px; }
  .menu-window-box ~ .menu-settings { max-height: calc(100vh - 12vh - 215px - min(30vh, 0.5625 * min(612px, 88vw - 48px))); }
  .menu-preview canvas { display: block; width: 100%; height: 120px; border: 3px solid var(--ink); margin-bottom: 8px;
    box-sizing: border-box; }
  .menu-row input:not([type]) { flex: 1 1 120px; min-width: 0; }
  .menu-choice > span:first-child { flex-basis: 100px; }
  .menu-opts { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  #menu .menu-choice button { padding: 6px 10px 4px; white-space: nowrap; }
  .menu-teams { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0; }
  #menu .menu-teams button { flex: 1 1 160px; padding: 16px 14px 12px; font-size: 24px; box-shadow: 5px 5px 0 var(--ink); }
  #menu .menu-teams button.t { color: var(--red); }
  #menu .menu-teams button.ct { color: var(--blue); }
  .menu-maps button { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-maps { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px;
    max-height: 40vh; overflow-y: auto; padding: 2px 6px 6px 2px; }
  #menu button.menu-go { margin-top: 12px; padding: 12px 30px 8px; font-size: 34px; background: var(--red);
    color: var(--yellow); border-width: 4px; box-shadow: 6px 6px 0 var(--ink); -webkit-text-stroke: 1.5px var(--ink);
    paint-order: stroke fill; text-shadow: 2px 2px 0 var(--ink); }
  #menu button.menu-reset { margin-top: 14px; font-size: 14px; }
  .menu-server { font-weight: 700; }
  .menu-tagline { margin: 0 0 14px; font-size: 16px; }
  .menu-features { margin: 0 0 12px; padding-left: 22px; }
  .menu-features li { margin: 2px 0; }
  .menu-hint { font-size: 13px; opacity: 0.7; }
  #menu button.menu-go:disabled { opacity: 0.45; cursor: not-allowed; }
  /* Your map: a drop zone for a .bsp file; an error under it; the room's invite link. */
  .menu-drop { display: block; margin: 10px 0; padding: 22px 16px; text-align: center; font-weight: 700;
    border: 3px dashed var(--ink); background: var(--paper-hi); cursor: pointer; }
  .menu-drop:hover, .menu-drop.over { background: var(--yellow); }
  .menu-drop.busy { opacity: 0.6; }
  .menu-drop input { display: none; }
  .menu-error { background: var(--red); color: var(--paper-hi); opacity: 1; padding: 4px 8px; }
  .menu-invite input { font-family: Consolas, monospace; }
  @media (max-width: 720px) {
    #menu { flex-direction: column; padding: 16px; gap: 14px; }
    .menu-side { flex: none; }
    #menu h1 { font-size: 48px; }
    .menu-logo { margin-bottom: 14px; }
    .menu-logo img { width: 48px; }
    .menu-nav { flex-direction: row; flex-wrap: wrap; }
    #menu .menu-nav button { font-size: 18px; }
    .menu-row { flex-wrap: wrap; }
    .menu-row > span:first-child { flex-basis: 100%; }
    .menu-row.check > span:first-child { flex: 1; }
    .menu-settings { max-height: none; }
    .hud { font-size: 28px; }
    #banner { font-size: 32px; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="status">loading...</div>
<div id="scope"></div>
<div id="flash"><div class="burst"><i class="ring r2"></i><i class="ring"></i><i class="star"></i><i class="core"></i></div><b>FLASH!</b></div>
<canvas id="radar"></canvas>
<pre id="debug"></pre>
<div id="killfeed"></div>
<div id="roundbar"></div>
<div id="banner"></div>
<div id="hud-money"></div>
<div id="hud-bomb"></div>
<div id="progress"><div></div><div></div></div>
<div id="scoreboard"></div>
<div id="buymenu"></div>
<div id="death"></div>
<div id="deathpanel"></div>
<div id="fx"></div>
<div id="menu"></div>
<div id="hud-left" class="hud">
  <span><small>HP</small><span id="hud-health"></span></span>
  <span><small>ARMOR</small><span id="hud-armor"></span></span>
</div>
<div id="hud-right" class="hud">
  <span id="hud-weapon"></span>
  <span id="hud-ammo"></span>
</div>
<!-- If any module fails to load (often an ad blocker), say so instead of hanging on "loading...". -->
<script type="module" src="/client/main.js"
  onerror="document.getElementById('status').textContent = 'Failed to load the game scripts. If an ad blocker is on, allow this site; then check the console.'"></script>
</body>
</html>
