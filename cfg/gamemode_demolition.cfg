// Demolition (game_type 1, game_mode 1): runs when a map loads in this mode, like CS:GO's.
// Bomb rounds with no buying: everyone starts on the first weapon of the list
// (shared/progression.js), and a round with a kill gives the next one for the next round.
// Put your own changes in gamemode_demolition_server.cfg (runs right after this one).
// Values marked (approx.) are estimates of CS:GO's.
//
// Switch a running server to it:  game_type 1; game_mode 1; map de_dust2

mp_freezetime 3 // (approx.)
mp_roundtime 1.5
mp_roundtime_defuse 1.5
mp_roundtime_hostage 1.5
mp_buytime 0
mp_round_restart_delay 5 // (approx.)
mp_maxrounds 20
mp_c4timer 40
mp_startmoney 0
mp_maxmoney 16000
mp_warmuptime 0

mp_teammates_are_enemies 0
mp_respawn_on_death_t 0
mp_respawn_on_death_ct 0
mp_randomspawn 0
mp_ignore_round_win_conditions 0
mp_timelimit 0
mp_buy_anywhere 0
mp_free_armor 1 // (approx.)
mp_give_player_c4 1
mp_hostages_max 0 // a bomb mode
mp_respawn_immunitytime 0
mp_death_drop_gun 0
mp_match_restart_delay 15
mp_halftime 1
mp_teamsize_max 0
