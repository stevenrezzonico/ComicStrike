// Short competitive (game_type 0, game_mode 1, sv_game_mode_flags 32): runs when a map loads
// in this mode, like CS:GO's gamemode_competitive_short.cfg: competitive's, 16 rounds (the sides
// swap after 8), no overtime (8-8 is a draw). Put your own changes in
// gamemode_competitive_short_server.cfg (runs right after this one).

