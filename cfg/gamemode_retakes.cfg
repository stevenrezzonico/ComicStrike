// Retakes (game_type 0, game_mode 3; after CS:GO's Retakes): every round starts with the
// bomb planted on a random site, the Terrorists round it and the Counter-Terrorists at its
// entrances, coming to take it back. No money and no buying: loadouts by round (pistols
// for the first two, then rifles, now and then SMGs), armor, a grenade, a kit for every CT.
// The bomb ticks from the end of the freeze. Put your own changes in
// gamemode_retakes_server.cfg (runs right after this one). Values marked (approx.) are
// estimates of CS:GO's.
//
// Switch a running server to it:  game_type 0; game_mode 3; map de_dust2

mp_freezetime 3 // (approx.)
mp_roundtime 1.92
mp_roundtime_defuse 1.92
mp_roundtime_hostage 1.92
mp_buytime 0
mp_round_restart_delay 4 // (approx.)
mp_maxrounds 16 // (approx.)
mp_c4timer 40
mp_startmoney 0
mp_maxmoney 0
mp_warmuptime 0

mp_teammates_are_enemies 0
mp_solid_teammates 1
mp_respawn_on_death_t 0
mp_respawn_on_death_ct 0
mp_randomspawn 0
mp_ignore_round_win_conditions 0
mp_timelimit 0
mp_buy_anywhere 0
mp_free_armor 0
mp_give_player_c4 0
mp_hostages_max 2
mp_respawn_immunitytime 0
mp_death_drop_gun 1
mp_death_drop_grenade 2
mp_death_drop_defuser 1
mp_friendlyfire 0 // (approx.)
mp_match_restart_delay 15
mp_halftime 1
mp_teamsize_max 0
mp_overtime_enable 0
