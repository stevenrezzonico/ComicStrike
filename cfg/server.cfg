// Runs when the server starts (server/main.js). Same syntax as the CS:GO server.cfg.
// The rcon password is best set with the RCON_PASSWORD environment variable.
// The game mode (game_type / game_mode: 0 0 casual, 0 1 competitive, 0 2 wingman,
// 1 0 arms race, 1 1 demolition, 1 2 deathmatch, 2 0 demo) runs its
// cfg/gamemode_<mode>.cfg after this file when the map loads, then
// cfg/gamemode_<mode>_server.cfg: put mode settings (mp_*) there, as in CS:GO.

// game_type 0
// game_mode 1

hostname "ComicStrike"
// rcon_password ""

// Competitive defaults (set them in gamemode_competitive_server.cfg):
// mp_freezetime 15
// mp_roundtime 1.92
// mp_roundtime_defuse 1.92
// mp_roundtime_hostage 1.92
// mp_buytime 20
// mp_round_restart_delay 7
// mp_maxrounds 30
// mp_c4timer 40
// mp_startmoney 800
// mp_maxmoney 16000
// mp_warmuptime 0
