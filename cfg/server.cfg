// Runs when the server starts (server/main.js). Same syntax as the CS:GO server.cfg.
// The rcon password is best set with the RCON_PASSWORD environment variable. With none, the
// server makes one up at startup and prints the admin page's link with it (admin page: ...).
// The game mode (game_type / game_mode: 0 0 casual, 0 1 competitive, 0 2 wingman,
// 1 0 arms race, 1 1 demolition, 1 2 deathmatch, 2 0 demo) runs its
// cfg/gamemode_<mode>.cfg after this file when the map loads, then
// cfg/gamemode_<mode>_server.cfg: put mode settings (mp_*) there, as in CS:GO.

game_type 1 // deathmatch (0 1: competitive)
game_mode 2

hostname "ComicStrike"

// Bots fill the server up to 10 players once someone plays (a bot leaves for each player who
// joins), and leave with the last one.
bot_quota 10
bot_quota_mode fill
bot_join_after_player 1
// rcon_password ""

