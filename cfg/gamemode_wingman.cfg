// Wingman (game_type 0, game_mode 2): runs when a map loads in this mode, like CS:GO's
// Wingman: 2 against 2, 16 rounds with the sides swapping after 8. CS:GO plays it on
// small single-site maps; here the mode keeps one bomb site of the map (B, the second in
// entity order). Put your own changes in gamemode_wingman_server.cfg (runs right after
// this one). Values marked (approx.) are estimates of CS:GO's.
//
// Switch a running server to it:  game_type 0; game_mode 2; map de_dust2

mp_freezetime 10 // (approx.)
mp_roundtime 1.5
mp_roundtime_defuse 1.5
mp_roundtime_hostage 1.5
mp_buytime 15 // (approx.)
mp_round_restart_delay 5 // (approx.)
mp_maxrounds 16
mp_c4timer 40
mp_startmoney 800
mp_maxmoney 8000 // (approx.)
mp_warmuptime 0

mp_teammates_are_enemies 0
mp_respawn_on_death_t 0
mp_respawn_on_death_ct 0
mp_randomspawn 0
mp_ignore_round_win_conditions 0
mp_timelimit 0
mp_buy_anywhere 0
mp_free_armor 0
mp_give_player_c4 1
mp_hostages_max 2
mp_respawn_immunitytime 0
mp_death_drop_gun 1
mp_match_restart_delay 15
mp_halftime 1
mp_teamsize_max 2
mp_overtime_enable 1
