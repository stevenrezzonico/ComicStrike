// Arms Race (game_type 1, game_mode 0): runs when a map loads in this mode, like CS:GO's
// gun game. Teams, instant respawns, no buying: every kill gives the next weapon of the
// list (shared/progression.js) at once, a knife kill also takes a level from the victim,
// and the first to make a kill with the last weapon, the knife, wins the match. Put your
// own changes in gamemode_armsrace_server.cfg (runs right after this one). Values marked
// (approx.) are estimates of CS:GO's.
//
// Switch a running server to it:  game_type 1; game_mode 0; map de_dust2

mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_roundtime_hostage 60
mp_buytime 0
mp_round_restart_delay 7
mp_maxrounds 30
mp_c4timer 40
mp_startmoney 0
mp_maxmoney 16000
mp_warmuptime 0

mp_teammates_are_enemies 0
mp_respawn_on_death_t 1
mp_respawn_on_death_ct 1
mp_randomspawn 1 // CS:GO's Arms Race maps are small; on the big maps, spawns away from enemies keep it close (approx.)
mp_ignore_round_win_conditions 1 // one match-long round: the winning knife kill ends it
mp_timelimit 15 // nobody got there: the furthest along wins (approx.)
mp_buy_anywhere 0
mp_free_armor 1 // (approx.)
mp_give_player_c4 0
mp_hostages_max 0
mp_respawn_immunitytime 2 // (approx.)
mp_death_drop_gun 0
mp_match_restart_delay 15
mp_halftime 0
mp_teamsize_max 0
