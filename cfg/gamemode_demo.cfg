// Demo (game_type 2, game_mode 0): a playground for trying things out, run when a map
// loads in this mode. The mode itself makes buying free, anywhere and anytime, ammo and
// grenades infinite, humans unable to die (they take the hit, then heal), lets anyone
// plant and defuse, and hands the bomb back after each explosion or defuse; this file
// sets the round rules around that, like the practice configs CS:GO players use. Put your
// own changes in gamemode_demo_server.cfg (runs right after this one).
//
// Switch a running server to it:  game_type 2; game_mode 0; map de_dust2

mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_roundtime_hostage 60
mp_buytime 3600
mp_warmuptime 0
mp_startmoney 16000
mp_maxmoney 16000

mp_teammates_are_enemies 0
mp_respawn_on_death_t 1 // bots come back to be targets again
mp_respawn_on_death_ct 1
mp_randomspawn 0
mp_ignore_round_win_conditions 1 // one endless round: the bomb, deaths and the clock end nothing
mp_timelimit 0
mp_buy_anywhere 1
mp_free_armor 0
mp_give_player_c4 0 // the demo hands the bomb to the player instead
mp_hostages_max 2
mp_respawn_immunitytime 0
mp_death_drop_gun 0
mp_match_restart_delay 15
