// Casual (game_type 0, game_mode 0): runs when a map loads in this mode, like CS:GO's
// casual mode: bigger teams, shorter matches, free armor, more money to start with and
// a lower cap, no side swap. Put your own changes in gamemode_casual_server.cfg (runs
// right after this one). Values marked (approx.) are estimates of CS:GO's.
//
// Switch a running server to it:  game_type 0; game_mode 0; map de_dust2

mp_freezetime 6 // (approx.)
mp_roundtime 2.25
mp_roundtime_defuse 2.25
mp_roundtime_hostage 2.25
mp_buytime 45
mp_round_restart_delay 7
mp_maxrounds 15
mp_c4timer 40
mp_startmoney 1000
mp_maxmoney 10000
mp_warmuptime 0

mp_teammates_are_enemies 0
mp_respawn_on_death_t 0
mp_respawn_on_death_ct 0
mp_randomspawn 0
mp_ignore_round_win_conditions 0
mp_timelimit 0
mp_buy_anywhere 0
mp_free_armor 1 // kevlar and a helmet every round
mp_give_player_c4 1
mp_hostages_max 2
mp_respawn_immunitytime 0
mp_death_drop_gun 1
mp_match_restart_delay 15
mp_halftime 0 // (approx.)
mp_teamsize_max 0
mp_overtime_enable 0
