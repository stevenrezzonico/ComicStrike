// Deathmatch (game_type 1, game_mode 2): runs when a map loads in this mode, like
// CS:GO's gamemode_deathmatch.cfg. Free for all; set mp_teammates_are_enemies 0 for
// team deathmatch. Put your own changes in gamemode_deathmatch_server.cfg (runs right
// after this one). Values marked (approx.) are estimates of CS:GO's.
//
// Switch a running server to it:  game_type 1; game_mode 2; map de_dust2

mp_teammates_are_enemies 1
mp_respawn_on_death_t 1
mp_respawn_on_death_ct 1
mp_randomspawn 1
mp_ignore_round_win_conditions 1
mp_timelimit 10
mp_freezetime 0
mp_warmuptime 0
mp_buytime 15 // seconds after each spawn to pick weapons, free (approx.)
mp_buy_anywhere 1
mp_free_armor 1
mp_give_player_c4 0
mp_hostages_max 0
mp_respawn_immunitytime 4 // (approx.)
mp_death_drop_gun 0
mp_match_restart_delay 15
mp_halftime 1
mp_teamsize_max 0
mp_overtime_enable 0
